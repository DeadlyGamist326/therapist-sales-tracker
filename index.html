<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Therapist Sales Tracker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#667085;--line:#d9dde5;--acc:#2f6fed;--warn:#b54708;--warnbg:#fff1e0}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--ink:#e8ebf1;--mute:#98a2b3;--line:#2c3340;--acc:#6b9bff;--warn:#f5a44b;--warnbg:#3a2b17}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input[type=password]{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:var(--warn)}
label.file{display:inline-block;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
label.file input{display:none}
.mute{color:var(--mute);font-size:13px}
.status{font-size:13px;color:var(--mute);margin-top:6px;min-height:18px}
#strip{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.th{position:relative;flex:0 0 auto;width:76px;height:76px;border-radius:8px;overflow:hidden;border:2px solid var(--line);cursor:pointer}
.th.sel{border-color:var(--acc)}
.th img{width:100%;height:100%;object-fit:cover}
.th .b{position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;font-size:11px;padding:1px 5px}
textarea{width:100%;min-height:100px;font:14px/1.4 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.tables{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.tables h2{font-size:14px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border:1px solid var(--line);padding:0 6px;height:34px;white-space:nowrap}
th{background:var(--bg);font-weight:600;text-align:left;font-size:12px}
td[contenteditable]:focus{outline:2px solid var(--acc)}
td.bad{background:var(--warnbg)}
/* camera overlay */
#cam{position:fixed;inset:0;background:#000;z-index:10;display:none;flex-direction:column}
#cam video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
#cam .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;color:#fff;gap:10px}
#shutter{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:#fff3;padding:0}
#shutter:active{background:#fff}
#cam button.t{background:#fff2;color:#fff;border-color:#fff5}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
</style>
</head>
<body>
<main>
<h1>Therapist Sales Tracker</h1>

<div class="card">
  <div class="row">
    <button class="primary" id="openCam">📷 Use camera</button>
    <label class="file">🖼️ Upload / paste (pic, PDF)<input id="up" type="file" accept="image/*,application/pdf,.pdf" multiple></label>
    <select id="engine">
      <option value="tess">Libre (Tesseract) - mahina sa sulat-kamay</option>
      <option value="gemini">Gemini (libreng API key)</option>
      <option value="claude">Claude (API key)</option>
    </select>
    <label class="file">📋 Listahan ng clients<input id="names" type="file" accept=".txt,.csv"></label>
    <button id="addText">📝 Paste text</button>
    <span class="mute" id="namesInfo"></span>
  </div>
  <details id="claudeBox" style="display:none;margin-top:8px" open><summary class="mute" id="keyLabel">API key</summary>
    <div class="row" style="margin-top:6px"><input id="key" type="password" placeholder="API key" style="flex:1;min-width:200px"><input id="gmodel" type="text" value="gemini-3.8-flash" style="width:170px;display:none;font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)" aria-label="Gemini model"><span class="mute">Sa phone mo lang naka-save.</span></div>
  </details>
  <div id="strip"></div>
  <div class="status" id="status"></div>
  <div id="editor" style="display:none">
    <div class="mute" style="margin:4px 0">Text ng napiling picture (i-edit kung may mali, tapos "Gawing table"):</div>
    <textarea id="raw"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="parse">Gawing table</button>
      <button id="reread">Basahin ulit</button>
      <button class="danger" id="delPic">Burahin ang picture</button>
    </div>
  </div>
</div>

<div class="tables">
  <div class="card">
    <h2>Clients <button id="copy1">Copy</button></h2>
    <div class="wrap"><table id="t1"><thead><tr><th>Date</th><th>Client</th></tr></thead><tbody></tbody></table></div>
  </div>
  <div class="card">
    <h2>Therapist <button id="copy2">Copy</button></h2>
    <div class="wrap"><table id="t2"><thead><tr><th>Therapist</th><th>Service</th><th>Hrs</th></tr></thead><tbody></tbody></table></div>
  </div>
</div>
<div class="row"><span class="mute" id="count"></span><button class="danger" id="clearAll" style="margin-left:auto">Burahin lahat</button></div>
</main>

<div id="cam">
  <video id="vid" playsinline autoplay muted></video>
  <div id="flash"></div>
  <div class="bar">
    <button class="t" id="camDone">Tapos</button>
    <button id="shutter" aria-label="Kuhanan"></button>
    <span id="camCount">0 kuha</span>
  </div>
</div>
<input id="fallbackCam" type="file" accept="image/*" capture="environment" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const THERAPISTS = ["Lucy","Lea","Dolly","Merly","Mitch","Delia"];
const YEAR = 2026;
const $ = id => document.getElementById(id);
let knownNames = [];
let photos = [];          // {id, blob, text, entries, status, url}
let selId = null;
const store = {
  get(k){ try{return localStorage.getItem(k)}catch(e){return null} },
  set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }
};

/* ---------- IndexedDB (pictures stay after closing the page) ---------- */
const DB = {
  db:null,
  open(){
    return new Promise(res=>{
      try{
        const r=indexedDB.open("tst",1);
        r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id"});
        r.onsuccess=()=>{DB.db=r.result;res(true)};
        r.onerror=()=>res(false);
      }catch(e){res(false)}
    });
  },
  tx(mode){ return DB.db.transaction("photos",mode).objectStore("photos"); },
  put(p){ if(!DB.db) return; try{ DB.tx("readwrite").put({id:p.id,blob:p.blob,text:p.text,entries:p.entries,status:p.status}); }catch(e){} },
  del(id){ if(!DB.db) return; try{ DB.tx("readwrite").delete(id); }catch(e){} },
  clear(){ if(!DB.db) return; try{ DB.tx("readwrite").clear(); }catch(e){} },
  all(){ return new Promise(res=>{ if(!DB.db) return res([]); try{ const r=DB.tx("readonly").getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>res([]); }catch(e){res([])} }); }
};

/* ---------- parsing ---------- */
function lev(a,b){
  a=a.toLowerCase(); b=b.toLowerCase();
  const d=[...Array(a.length+1)].map((_,i)=>[i]);
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
function matchTherapist(tok){
  let best=null,bd=9;
  for(const t of THERAPISTS){
    const d=lev(tok,t), lim=t.length<=3?0:1;
    if(d<=lim&&d<bd){best=t;bd=d}
  }
  return best;
}
const MONTHS=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const DATE_NUM=/\b(\d{1,2})\s*[\/\-]\s*(\d{1,2})(?:\s*[\/\-.]\s*(\d{2,4}))?\b|\b(\d{1,2})\.(\d{1,2})\.(\d{2,4})\b/;
const DATE_TXT=/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s*(\d{1,2})\b(?:\s*,?\s*\d{4})?/i;
function isoDate(mo,d){ return YEAR+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
function findDate(line){
  let m=line.match(DATE_TXT);
  if(m){ const mo=MONTHS.indexOf(m[1].slice(0,3).toLowerCase())+1; const d=+m[2]; if(d>=1&&d<=31) return {text:m[0],iso:isoDate(mo,d)}; }
  m=line.match(DATE_NUM);
  if(m){
    const a=+(m[1]||m[4]), b=+(m[2]||m[5]);
    if(a>=1&&a<=12&&b>=1&&b<=31) return {text:m[0],iso:isoDate(a,b)};
  }
  return null;
}
function showDate(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return (+m)+"/"+(+d)+"/"+y; }
function normHours(s){
  let n=parseFloat(s.replace(",","."));
  if(isNaN(n)) return "";
  return String(Math.max(1,Math.round(n*2)/2));
}
function titleCase(s){ return s.replace(/\w\S*/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase()); }
function snapName(name){
  if(!knownNames.length||!name) return name;
  let best=null,bd=99;
  for(const k of knownNames){ const d=lev(name,k); if(d<bd){bd=d;best=k} }
  const lim=Math.max(1,Math.floor(Math.min(name.length,best?best.length:0)/4));
  return best&&bd<=lim?best:name;
}
const PAY=/\b(g\s?cash|gcash|cash|card|maya|paid|bank|transfer)\b/gi;
const WEEKDAY=/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/gi;
/* Sheet layout: date header, then a "time + client" line, then one line per therapist
   (therapist, hours, payment, amount). The client is carried over to its therapist lines. */
function parseText(text){
  const entries=[]; let cur="", client="", used=true;
  const flush=()=>{ if(client&&!used) entries.push({date:cur,client,therapist:"",service:"BM",hours:""}); };
  text.split(/\r?\n/).forEach(raw=>{
    let line=raw.replace(/[|_"“”]+/g," ").trim();
    if(!line) return;
    const dt=findDate(line);
    if(dt){ flush(); cur=dt.iso; client=""; used=true; line=line.replace(dt.text," "); }
    line=line.replace(WEEKDAY," ")
      .replace(/^\s*\d{1,2}(?::\d{2})?\s*(?:am|pm|a\.m\.|p\.m\.)(?![a-z])\s*/i,"")   // 3pm
      .replace(/^\s*\d{3,4}\s+(?=[A-Za-z])/,"")                                          // 730
      .replace(PAY," ").trim();
    let hs=false;
    line=line.replace(/\b(hot\s*stone|h\.?\s?s\.?)(?![a-z])/gi,()=>{hs=true;return " "});
    let hours="";
    const hm=line.match(/(?:^|[\s(])(\d(?:[.,]\d)?)(?=$|[\s),;]|hrs?|h\b)/i);
    if(hm) hours=normHours(hm[1]);
    let ther=null,therTok=null;
    const toks=line.split(/[\s,;:()\/\-]+/).filter(Boolean);
    for(const t of toks){ const e=THERAPISTS.find(n=>n.toLowerCase()===t.toLowerCase()); if(e){ther=e;therTok=t;break} }
    // fuzzy (handwriting) only on lines that have hours, so a client like "Molly" is not turned into Dolly
    if(!ther&&hours!=="") for(let i=0;i<toks.length;i++){
      const t=toks[i];
      if(!/^[A-Za-z]{3,}$/.test(t)||/^(delos|del|lee)$/i.test(t)) continue;
      if(/^dela$/i.test(t)&&/^[A-Za-z]{2,}$/.test(toks[i+1]||"")) continue;   // "dela Cruz" = surname
      const m=/^dela$/i.test(t)?"Delia":matchTherapist(t);
      if(m){ther=m;therTok=t;break}
    }
    let rest=line;
    if(therTok) rest=rest.replace(new RegExp("\\b"+therTok+"\\b"),"  ");
    if(hm) rest=rest.replace(hm[1]," ");
    rest=rest.replace(/\b(hrs?|hours?)\b/gi," ").replace(/[^A-Za-zÀ-ɏ.'\- ]+/g," ").replace(/\s+/g," ").trim().replace(/^[-.' ]+|[-.' ]+$/g,"");
    const name=rest?snapName(titleCase(rest)):"";
    if(!ther&&hours===""){                 // a client line (or a date/weekday-only line)
      if(!name) return;
      flush(); client=name; used=false; return;
    }
    let c=client;
    if(name){ flush(); client=c=name; }    // one-line format: "Maria Santos Lucy 1.5 HS"
    entries.push({date:cur,client:c,therapist:ther||"",service:hs?"Hotstone":"BM",hours});
    used=true;
  });
  flush();
  return entries;
}

/* ---------- tables ---------- */
let view=[]; // sorted entry refs
function allEntries(){ const a=[]; photos.forEach(p=>(p.entries||[]).forEach((e,i)=>a.push({e,p,i}))); return a; }
function sortView(){
  const a=allEntries().map((x,n)=>({...x,n}));
  a.sort((x,y)=>{
    const dx=x.e.date||"9999", dy=y.e.date||"9999";
    return dx<dy?-1:dx>dy?1:x.n-y.n;
  });
  view=a;
}
function cell(tr,text,bad,onEdit){
  const td=document.createElement("td");
  td.contentEditable="true"; td.textContent=text;
  if(bad) td.className="bad";
  td.oninput=()=>onEdit(td.textContent.trim(),false);
  td.onblur=()=>onEdit(td.textContent.trim(),true);
  tr.appendChild(td); return td;
}
function render(){
  sortView();
  const b1=$("t1").tBodies[0], b2=$("t2").tBodies[0];
  b1.innerHTML=""; b2.innerHTML="";
  view.forEach(({e,p})=>{
    const t1=document.createElement("tr"), t2=document.createElement("tr");
    cell(t1,showDate(e.date),!e.date,(v,done)=>{
      if(!done) return;
      const d=findDate(v); const iso=d?d.iso:(v===""?"":e.date);
      if(iso!==e.date){ e.date=iso; DB.put(p); render(); }
    });
    cell(t1,e.client,!e.client,(v)=>{e.client=v;DB.put(p)});
    cell(t2,e.therapist,!e.therapist,(v)=>{e.therapist=v;DB.put(p)});
    cell(t2,e.service,false,(v)=>{e.service=v;DB.put(p)});
    cell(t2,e.hours,!e.hours,(v)=>{e.hours=v;DB.put(p)});
    b1.appendChild(t1); b2.appendChild(t2);
  });
  $("count").textContent=view.length+" rows • "+photos.length+" pictures";
}
function tableText(id){
  return [...$(id).tBodies[0].rows].map(tr=>[...tr.cells].map(c=>c.textContent.trim()).join("\t")).join("\n");
}
async function copy(id,btn){
  const text=tableText(id);
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy")}catch(_){} ta.remove(); }
  const old=btn.textContent; btn.textContent="Copied!"; setTimeout(()=>btn.textContent=old,1200);
}

/* ---------- photo strip ---------- */
function renderStrip(){
  const s=$("strip"); s.innerHTML="";
  photos.forEach((p,i)=>{
    if(!p.url&&p.blob) p.url=URL.createObjectURL(p.blob);
    const d=document.createElement("div"); d.className="th"+(p.id===selId?" sel":"");
    d.innerHTML=(p.blob?'<img alt="">':'<div style="display:flex;height:100%;align-items:center;justify-content:center;font-size:26px">📝</div>')+'<span class="b"></span>';
    if(p.blob) d.querySelector("img").src=p.url;
    d.querySelector(".b").textContent=(i+1)+" "+({queued:"⏳",reading:"🔍",done:"✓",error:"⚠"}[p.status]||"");
    d.onclick=()=>select(p.id);
    s.appendChild(d);
  });
  $("editor").style.display=selId?"block":"none";
}
function select(id){
  selId=id; const p=photos.find(x=>x.id===id);
  $("raw").value=p?p.text:""; renderStrip();
}
function addPhoto(blob){
  const p={id:Date.now()+"-"+Math.random().toString(36).slice(2,7),blob,text:"",entries:[],status:"queued"};
  photos.push(p); DB.put(p); renderStrip(); queue.push(p.id); pump();
  return p;
}

/* ---------- OCR queue (runs in the background while you keep shooting) ---------- */
const queue=[]; let busy=false, tessWorker=null;
function setStatus(t){ $("status").textContent=t; }
async function pump(){
  if(busy) return; busy=true;
  while(queue.length){
    const p=photos.find(x=>x.id===queue.shift()); if(!p) continue;
    p.status="reading"; renderStrip();
    try{
      setStatus("Binabasa ang picture "+(photos.indexOf(p)+1)+(queue.length?" ("+queue.length+" pa sa pila)":"")+"...");
      p.text=(await readImage(p.blob)).trim();
      p.entries=parseText(p.text); p.status="done";
    }catch(e){ p.status="error"; setStatus("Error: "+e.message); }
    DB.put(p); if(selId===p.id) $("raw").value=p.text;
    renderStrip(); render();
  }
  busy=false;
  if(!photos.some(p=>p.status==="error")) setStatus("Tapos na. I-check ang table.");
}
async function readImage(blob){
  const e=$("engine").value; return e==="claude"?readClaude(blob):e==="gemini"?readGemini(blob):readTess(blob);
}
async function readTess(blob){
  if(!window.Tesseract) throw new Error("Hindi na-load ang Tesseract (kailangan ng internet sa unang gamit).");
  if(!tessWorker) tessWorker=await Tesseract.createWorker("eng");
  const r=await tessWorker.recognize(blob);
  return r.data.text;
}
function toBase64(blob){
  return new Promise((ok,no)=>{
    const img=new Image(), url=URL.createObjectURL(blob);
    img.onload=()=>{
      const s=Math.min(1,1600/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg",0.85).split(",")[1]);
    };
    img.onerror=no; img.src=url;
  });
}
const OCR_PROMPT="Transcribe this handwritten sales sheet exactly as written, keeping every line break and the order. Layout: a date header at the top, then for each client a line with the time and the client name, followed by one indented line per therapist (therapist name, hours like 1hr or 1.5, payment like Cash or GCash, amount). Therapist names can only be: "+THERAPISTS.join(", ")+". Output plain text only, no commentary.";
function keyStore(){ return $("engine").value==="gemini"?"tst_gkey":"tst_key"; }
async function readClaude(blob){
  const key=$("key").value.trim();
  if(!key) throw new Error("Ilagay muna ang Claude API key.");
  const data=await toBase64(blob);
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:1500,messages:[{role:"user",content:[
      {type:"image",source:{type:"base64",media_type:"image/jpeg",data}},
      {type:"text",text:OCR_PROMPT}
    ]}]})
  });
  const j=await r.json();
  if(!r.ok) throw new Error((j.error&&j.error.message)||("Error "+r.status));
  return j.content.map(c=>c.text||"").join("");
}
async function readGemini(blob){
  const key=$("key").value.trim();
  if(!key) throw new Error("Ilagay muna ang Gemini API key (aistudio.google.com).");
  const model=($("gmodel").value.trim()||"gemini-3.8-flash");
  const data=await toBase64(blob);
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(key),{
    method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:"image/jpeg",data}},{text:OCR_PROMPT}]}]})
  });
  const j=await r.json();
  if(!r.ok) throw new Error((j.error&&j.error.message)||("Error "+r.status));
  const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
  const t=parts.map(x=>x.text||"").join("");
  if(!t) throw new Error("Walang sagot ang Gemini.");
  return t;
}

/* ---------- files: images and PDFs (each PDF page becomes one picture) ---------- */
const MAX_PDF_PAGES=40;
function isPdf(f){ return f.type==="application/pdf"||/\.pdf$/i.test(f.name||""); }
async function addFiles(list){
  for(const f of [...list]){
    if(isPdf(f)){ try{ await addPdf(f); }catch(e){ setStatus("PDF error: "+e.message); } }
    else if((f.type||"").startsWith("image/")||/\.(png|jpe?g|webp|heic)$/i.test(f.name||"")) addPhoto(f);
    else setStatus("Hindi suportado: "+(f.name||f.type)+" (png, jpeg o pdf lang).");
  }
}
async function addPdf(file){
  if(!window.pdfjsLib) throw new Error("Hindi na-load ang PDF reader (kailangan ng internet).");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const n=Math.min(pdf.numPages,MAX_PDF_PAGES);
  for(let i=1;i<=n;i++){
    setStatus("PDF: page "+i+" / "+n+"...");
    const page=await pdf.getPage(i);
    const base=page.getViewport({scale:1});
    const vp=page.getViewport({scale:Math.min(3,2200/Math.max(base.width,base.height))});
    const c=document.createElement("canvas"); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
    await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.92));
    if(blob) addPhoto(blob);
  }
  if(pdf.numPages>n) setStatus("Unang "+n+" pages lang ng PDF ang kinuha ("+pdf.numPages+" total).");
}

/* ---------- camera (stays open for continuous shots) ---------- */
let stream=null, shots=0;
async function openCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ $("fallbackCam").click(); return; }
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:2560},height:{ideal:1440}},audio:false});
  }catch(e){ $("fallbackCam").click(); return; }
  shots=0; $("camCount").textContent="0 kuha";
  $("vid").srcObject=stream; $("cam").style.display="flex";
}
function closeCamera(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  $("vid").srcObject=null; $("cam").style.display="none";
}
function shoot(){
  const v=$("vid"); if(!v.videoWidth) return;
  const c=document.createElement("canvas"); c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext("2d").drawImage(v,0,0);
  c.toBlob(b=>{
    if(!b) return;
    const p=addPhoto(b); selId=p.id; $("raw").value=""; renderStrip();
    shots++; $("camCount").textContent=shots+" kuha";
  },"image/jpeg",0.92);
  const f=$("flash"); f.style.opacity=.8; setTimeout(()=>f.style.opacity=0,120);
}

/* ---------- wiring ---------- */
$("openCam").onclick=openCamera;
$("shutter").onclick=shoot;
$("camDone").onclick=closeCamera;
$("fallbackCam").onchange=e=>{ addFiles(e.target.files); e.target.value=""; };
$("up").onchange=e=>{ addFiles(e.target.files); e.target.value=""; };
/* Ctrl+V paste and drag-and-drop of png / jpeg / pdf */
document.addEventListener("paste",e=>{
  const cd=e.clipboardData; if(!cd) return;
  let files=[...(cd.files||[])];
  if(!files.length) files=[...(cd.items||[])].filter(i=>i.kind==="file").map(i=>i.getAsFile()).filter(Boolean);
  if(!files.length) return;           // plain text paste (e.g. into the text box) works as usual
  e.preventDefault(); addFiles(files);
});
document.addEventListener("dragover",e=>{ if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
document.addEventListener("drop",e=>{
  if(!e.dataTransfer||!e.dataTransfer.files.length) return;
  e.preventDefault(); addFiles(e.dataTransfer.files);
});
$("parse").onclick=()=>{
  const p=photos.find(x=>x.id===selId); if(!p) return;
  p.text=$("raw").value; p.entries=parseText(p.text); p.status="done"; DB.put(p); renderStrip(); render();
};
$("reread").onclick=()=>{ const p=photos.find(x=>x.id===selId); if(!p) return; p.status="queued"; queue.push(p.id); renderStrip(); pump(); };
$("delPic").onclick=()=>{
  const i=photos.findIndex(x=>x.id===selId); if(i<0) return;
  if(!confirm("Burahin ang picture na ito at ang mga row niya?")) return;
  DB.del(selId); photos.splice(i,1); selId=photos.length?photos[Math.min(i,photos.length-1)].id:null;
  select(selId); render();
};
$("clearAll").onclick=()=>{
  if(!photos.length||!confirm("Burahin ang lahat ng pictures at table?")) return;
  photos=[]; selId=null; DB.clear(); renderStrip(); render(); setStatus("");
};
$("copy1").onclick=e=>copy("t1",e.target);
$("copy2").onclick=e=>copy("t2",e.target);
$("engine").onchange=()=>{
  const e=$("engine").value;
  $("claudeBox").style.display=e==="tess"?"none":"block";
  $("gmodel").style.display=e==="gemini"?"block":"none";
  $("keyLabel").textContent=e==="gemini"?"Gemini API key":"Claude API key";
  $("key").value=store.get(keyStore())||"";
  store.set("tst_engine",e);
};
$("key").oninput=()=>store.set(keyStore(),$("key").value.trim());
$("gmodel").onchange=()=>store.set("tst_gmodel",$("gmodel").value.trim());
$("addText").onclick=()=>{
  const p={id:Date.now()+"-"+Math.random().toString(36).slice(2,7),blob:null,text:"",entries:[],status:"done"};
  photos.push(p); DB.put(p); select(p.id); $("raw").focus();
};
$("names").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  knownNames=(await f.text()).split(/\r?\n|,/).map(s=>s.trim()).filter(Boolean);
  store.set("tst_names",JSON.stringify(knownNames));
  $("namesInfo").textContent=knownNames.length+" names";
  photos.forEach(p=>{ if(p.text){p.entries=parseText(p.text);DB.put(p)} }); render();
};
(async function init(){
  const gm=store.get("tst_gmodel"); if(gm&&gm!=="gemini-2.5-flash") $("gmodel").value=gm;
  const en=store.get("tst_engine"); if(en){ $("engine").value=en; $("engine").onchange(); }
  try{ const n=JSON.parse(store.get("tst_names")||"[]"); if(n.length){knownNames=n; $("namesInfo").textContent=n.length+" names";} }catch(e){}
  if(await DB.open()){
    photos=(await DB.all()).sort((a,b)=>a.id<b.id?-1:1);
    photos.forEach(p=>{ if(p.status==="reading"||p.status==="queued"){ p.status="queued"; queue.push(p.id); } });
    if(photos.length){ selId=photos[0].id; $("raw").value=photos[0].text||""; }
    pump();
  }
  renderStrip(); render();
})();
</script>
