<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Therapist Sales Tracker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#667085;--line:#d9dde5;--acc:#2f6fed;--ok:#1a7f4b;--warn:#b54708}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--ink:#e8ebf1;--mute:#98a2b3;--line:#2c3340;--acc:#6b9bff;--ok:#4cc38a;--warn:#f5a44b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input[type=text],input[type=password]{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5}
label.file{display:inline-block;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
label.file input{display:none}
#preview{max-width:100%;max-height:260px;border-radius:8px;display:none;margin-top:8px}
textarea{width:100%;min-height:110px;font:14px/1.4 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.tables{display:grid;grid-template-columns:1fr 2fr;gap:10px;align-items:start}
.tables h2{font-size:14px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border:1px solid var(--line);padding:6px 6px;min-width:28px;height:32px;vertical-align:middle}
th{background:var(--bg);font-weight:600;text-align:left;font-size:12px}
td[contenteditable]:focus{outline:2px solid var(--acc)}
.mute{color:var(--mute);font-size:13px}
.status{font-size:13px;color:var(--mute);margin-top:6px;min-height:18px}
.flag{color:var(--warn)}
details summary{cursor:pointer;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Therapist Sales Tracker</h1>

<div class="card">
  <div class="row">
    <label class="file">📷 Camera<input id="cam" type="file" accept="image/*" capture="environment"></label>
    <label class="file">🖼️ Upload pic<input id="up" type="file" accept="image/*"></label>
    <select id="engine">
      <option value="tess">Libre (Tesseract, sa phone)</option>
      <option value="claude">Claude (API key)</option>
    </select>
    <button class="primary" id="go" disabled>Basahin</button>
  </div>
  <img id="preview" alt="preview">
  <div class="status" id="status"></div>
  <details id="claudeBox" style="display:none;margin-top:8px"><summary>Claude API key</summary>
    <div class="row" style="margin-top:6px">
      <input id="key" type="password" placeholder="sk-ant-..." style="flex:1;min-width:200px">
      <span class="mute">Sa phone mo lang ise-save, hindi sa file.</span>
    </div>
  </details>
</div>

<div class="card">
  <div class="mute" style="margin-bottom:4px">Text na nabasa (pwede mong i-edit at pindutin ang "Gawing table"):</div>
  <textarea id="raw" placeholder="Isang linya bawat entry. Halimbawa: Maria Santos Lucy 1.5 HS"></textarea>
  <div class="row" style="margin-top:8px">
    <button id="parse">Gawing table</button>
    <label class="file">📋 Listahan ng clients<input id="names" type="file" accept=".txt,.csv"></label>
    <span class="mute" id="namesInfo"></span>
  </div>
  <div class="status" id="dates"></div>
</div>

<div class="tables">
  <div class="card">
    <h2>Clients <button id="copy1">Copy</button></h2>
    <table id="t1"><thead><tr><th>Client</th></tr></thead><tbody></tbody></table>
  </div>
  <div class="card">
    <h2>Therapist <button id="copy2">Copy</button></h2>
    <table id="t2"><thead><tr><th>Therapist</th><th>Service</th><th>Hrs</th></tr></thead><tbody></tbody></table>
  </div>
</div>
<div class="mute" id="issues"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const THERAPISTS = ["Lucy","Lea","Dolly","Merly","Mitch","Delia"];
const YEAR = 2026;
let knownNames = [];
let imgFile = null;
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{return localStorage.getItem(k)}catch(e){return null} },
  set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }
};

/* ---------- parsing ---------- */
function lev(a,b){
  a=a.toLowerCase(); b=b.toLowerCase();
  const d=[...Array(a.length+1)].map((_,i)=>[i]);
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
function matchTherapist(tok){
  let best=null,bd=9;
  for(const t of THERAPISTS){
    const d=lev(tok,t);
    const lim = t.length<=3 ? 0 : 1;
    if(d<=lim && d<bd){best=t;bd=d}
  }
  return best;
}
const MONTHS=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
// "." only counts as a date separator when there are 3 parts (so "1.5" stays hours)
const DATE_NUM=/\b(\d{1,2})\s*[\/\-]\s*(\d{1,2})(?:\s*[\/\-.]\s*(\d{2,4}))?\b|\b(\d{1,2})\.(\d{1,2})\.(\d{2,4})\b/;
const DATE_TXT=/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s*(\d{1,2})(?:\s*,?\s*(\d{4}))?\b/i;
function findDate(line){
  let m=line.match(DATE_TXT);
  if(m){
    const mo=MONTHS.indexOf(m[1].slice(0,3).toLowerCase())+1;
    return {text:m[0],label:fmtDate(mo,+m[2],m[3])};
  }
  m=line.match(DATE_NUM);
  if(m){
    const a=+(m[1]||m[4]),b=+(m[2]||m[5]),y=m[3]||m[6];
    if(a>=1&&a<=12&&b>=1&&b<=31) return {text:m[0],label:fmtDate(a,b,y)};
  }
  return null;
}
function fmtDate(mo,d,y){
  let yr=y?(+y<100?2000+ +y:+y):YEAR;
  if(yr!==YEAR) yr=YEAR; // content is 2026 for now
  return yr+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
function normHours(s){
  let n=parseFloat(s.replace(",","."));
  if(isNaN(n)) return null;
  n=Math.round(n*2)/2;
  return Math.max(1,n);
}
function snapName(name){
  if(!knownNames.length||!name) return name;
  let best=null,bd=99;
  for(const k of knownNames){
    const d=lev(name,k);
    if(d<bd){bd=d;best=k}
  }
  const lim=Math.max(1,Math.floor(Math.min(name.length,best?best.length:0)/4));
  return best&&bd<=lim?best:name;
}
function parseText(text){
  const clients=[],rows=[],dates=[],issues=[];
  let curDate=null;
  text.split(/\r?\n/).forEach((raw,idx)=>{
    let line=raw.replace(/[|_]+/g," ").trim();
    if(!line) return;
    const dt=findDate(line);
    if(dt){ curDate=dt.label; if(!dates.includes(dt.label)) dates.push(dt.label); line=line.replace(dt.text," ").trim(); }
    let hs=false;
    line=line.replace(/\b(hot\s*stone|h\.?\s?s\.?)(?![a-z])/gi,()=>{hs=true;return " "});
    // therapist
    let ther=null,therTok=null;
    const toks=line.split(/[\s,;:()\/\-]+/).filter(Boolean);
    // exact name first, then fuzzy (handwriting), skipping common surname parts like "dela"
    for(const t of toks){
      const e=THERAPISTS.find(n=>n.toLowerCase()===t.toLowerCase());
      if(e){ther=e;therTok=t;break}
    }
    if(!ther) for(const t of toks){
      if(/^[A-Za-z]{3,}$/.test(t) && !/^(dela|delos|del|lee)$/i.test(t)){ const m=matchTherapist(t); if(m){ther=m;therTok=t;break} }
    }
    // hours
    let hours=null;
    const hm=line.match(/(?:^|[\s(])(\d(?:[.,]\d)?)(?=$|[\s),;]|hrs?|h\b)/i);
    if(hm) hours=normHours(hm[1]);
    // client = what is left
    let rest=line;
    if(therTok) rest=rest.replace(new RegExp("\\b"+therTok+"\\b"),"  ");
    if(hm) rest=rest.replace(hm[1]," ");
    rest=rest.replace(/\b(hrs?|hours?)\b/gi," ").replace(/[^A-Za-zÀ-ɏ.'\- ]+/g," ").replace(/\s+/g," ").trim();
    rest=rest.replace(/^[-.' ]+|[-.' ]+$/g,"");
    const client=rest?snapName(titleCase(rest)):"";
    if(!ther&&hours==null){
      if(dt&&!client) return; // date header only
      if(client){ clients.push(client); issues.push("Linya "+(idx+1)+": walang therapist/oras, kinuha lang bilang client: "+raw.trim()); }
      return;
    }
    if(client) clients.push(client);
    else issues.push("Linya "+(idx+1)+": walang nakitang pangalan ng client: "+raw.trim());
    if(!ther) issues.push("Linya "+(idx+1)+": walang nakitang therapist: "+raw.trim());
    if(hours==null) issues.push("Linya "+(idx+1)+": walang nakitang oras: "+raw.trim());
    rows.push({therapist:ther||"",service:hs?"Hotstone":"BM",hours:hours==null?"":String(hours)});
  });
  return {clients,rows,dates,issues};
}
function titleCase(s){ return s.replace(/\w\S*/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase()); }

/* ---------- tables ---------- */
function fill(tableId,data){
  const tb=$(tableId).tBodies[0]; tb.innerHTML="";
  data.forEach(r=>{
    const tr=document.createElement("tr");
    r.forEach(v=>{ const td=document.createElement("td"); td.contentEditable="true"; td.textContent=v; tr.appendChild(td); });
    tb.appendChild(tr);
  });
}
function tableText(tableId){
  return [...$(tableId).tBodies[0].rows].map(tr=>[...tr.cells].map(c=>c.textContent.trim()).join("\t")).join("\n");
}
async function copy(tableId,btn){
  const text=tableText(tableId);
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy")}catch(_){} ta.remove();
  }
  const old=btn.textContent; btn.textContent="Copied!"; setTimeout(()=>btn.textContent=old,1200);
}
function run(){
  const r=parseText($("raw").value);
  fill("t1",r.clients.map(c=>[c]));
  fill("t2",r.rows.map(x=>[x.therapist,x.service,x.hours]));
  $("dates").textContent=r.dates.length?"Petsa na nakita: "+r.dates.join(", "):"Walang petsang nakita (2026 ang assumed).";
  $("issues").innerHTML=r.issues.map(i=>'<div class="flag">⚠ '+i.replace(/</g,"&lt;")+'</div>').join("");
}

/* ---------- OCR ---------- */
function setStatus(t){ $("status").textContent=t; }
function onFile(f){
  if(!f) return;
  imgFile=f;
  const p=$("preview"); p.src=URL.createObjectURL(f); p.style.display="block";
  $("go").disabled=false; setStatus("");
}
async function readTess(file){
  if(!window.Tesseract) throw new Error("Hindi na-load ang Tesseract (kailangan ng internet sa unang gamit).");
  const res=await Tesseract.recognize(file,"eng",{logger:m=>{
    if(m.status) setStatus(m.status+(m.progress?" "+Math.round(m.progress*100)+"%":""));
  }});
  return res.data.text;
}
function toBase64(file){
  return new Promise((ok,no)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1600,s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      ok(c.toDataURL("image/jpeg",0.85).split(",")[1]);
    };
    img.onerror=no; img.src=url;
  });
}
async function readClaude(file){
  const key=$("key").value.trim();
  if(!key) throw new Error("Ilagay muna ang Claude API key.");
  store.set("tst_key",key);
  setStatus("Binabasa ng Claude...");
  const data=await toBase64(file);
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({
      model:"claude-sonnet-5-5",max_tokens:1500,
      messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:"image/jpeg",data}},
        {type:"text",text:"Transcribe this handwritten sales sheet exactly, one entry per line, keeping the order: date (if shown), client name, therapist name, hours, and any note like HS / H.S. / hotstone. Therapist names can only be: "+THERAPISTS.join(", ")+". Output plain text only, no commentary."}
      ]}]
    })
  });
  const j=await r.json();
  if(!r.ok) throw new Error((j.error&&j.error.message)||("Error "+r.status));
  return j.content.map(c=>c.text||"").join("");
}
$("go").onclick=async()=>{
  $("go").disabled=true;
  try{
    const txt=$("engine").value==="claude"?await readClaude(imgFile):await readTess(imgFile);
    $("raw").value=txt.trim(); setStatus("Tapos na. I-check ang text, tapos okay na ang table."); run();
  }catch(e){ setStatus("Error: "+e.message); }
  $("go").disabled=false;
};
$("cam").onchange=e=>onFile(e.target.files[0]);
$("up").onchange=e=>onFile(e.target.files[0]);
$("parse").onclick=run;
$("copy1").onclick=e=>copy("t1",e.target);
$("copy2").onclick=e=>copy("t2",e.target);
$("engine").onchange=()=>{ $("claudeBox").style.display=$("engine").value==="claude"?"block":"none"; store.set("tst_engine",$("engine").value); };
$("names").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  const t=await f.text();
  knownNames=t.split(/\r?\n|,/).map(s=>s.trim()).filter(Boolean);
  store.set("tst_names",JSON.stringify(knownNames));
  $("namesInfo").textContent=knownNames.length+" names";
  if($("raw").value.trim()) run();
};
(function init(){
  const k=store.get("tst_key"); if(k) $("key").value=k;
  const en=store.get("tst_engine"); if(en){ $("engine").value=en; $("engine").onchange(); }
  try{ const n=JSON.parse(store.get("tst_names")||"[]"); if(n.length){knownNames=n; $("namesInfo").textContent=n.length+" names";} }catch(e){}
})();
</script>
</body>
</html>
